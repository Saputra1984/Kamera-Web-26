<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ai Picture</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <style>
        /* Reset dasar untuk layar hitam penuh */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* Wadah Utama Viewfinder */
        #camera-view { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: 1; 
        }
        
        /* Elemen tombol sebagai wadah kosong (Z-index harus di atas kamera) */
        .ui-element { 
            position: absolute; 
            z-index: 10; 
            touch-action: none; 
            user-select: none; 
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            outline: none;
            -webkit-tap-highlight-color: transparent; /* Hilangkan efek kedip biru saat disentuh di Android WebView */
        }
        
        /* Canvas untuk pemrosesan AI di balik layar */
        #processing-canvas { display: none; }
    </style>
</head>
<body>
    <video id="camera-view" autoplay playsinline></video>

    <!-- Komponen Tombol Fisik Antarmuka -->
    <button id="gallery_preview" class="ui-element"></button>
    <button id="shutter_btn" class="ui-element"></button>
    
    <div id="right_actions_container" class="ui-element"></div>
    
    <button id="timer_btn" class="ui-element"></button>
    <input type="range" id="expSlider" class="ui-element">
    <button id="triple_dot_btn" class="ui-element"></button>
    <div id="dropdownMenu"></div>

    <canvas id="processing-canvas"></canvas>

    <!-- Memuat Basis Data Terlebih Dahulu -->
    <script src="database.js"></script>

    <!-- Fungsi Jembatan untuk Menembakkan Blueprint UI ke Elemen Fisik HTML -->
    <script>
        function applyBlueprintUI() {
            if (!window.APP_DATABASE || !window.APP_DATABASE.navigation_buttons) return;
            const buttons = window.APP_DATABASE.navigation_buttons;

            for (const key in buttons) {
                const config = buttons[key];
                const el = document.getElementById(config.id);
                
                if (el && config.ui_coordinate) {
                    // Terapkan seluruh aturan style CSS yang tersimpan di database.js secara dinamis
                    for (const styleProp in config.ui_coordinate) {
                        el.style[styleProp] = config.ui_coordinate[styleProp];
                    }
                    // Berikan label teks/ikon (seperti 🖼️, ⏱️, ⋮) jika ada
                    if (config.label && el.tagName !== 'INPUT') {
                        el.innerText = config.label;
                    }
                    // Pasang transisi jika disediakan di cetak biru
                    if (config.transition) {
                        el.style.transition = config.transition;
                    }
                }
            }
        }
        
        // Eksekusi penataan visual tepat saat DOM siap di memori HP
        document.addEventListener("DOMContentLoaded", applyBlueprintUI);
    </script>

    <!-- Memuat Mesin Logika Utama -->
    <script src="brain.js"></script>
</body>
</html>
