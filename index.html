<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kamera Web</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <style>
        /* CSS Reset & Pengunci Stabilitas Layar */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Viewfinder Utama */
        #camera-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            object-fit: cover;
            background: #111;
        }

        /* Mengamankan elemen teks & tombol agar mutlak diam di memori & tidak goyang */
        .stable-text, .btn-ui { 
            touch-action: manipulation; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* Komponen Tombol UI - Diberikan Ukuran Bawaan Sesuai Blueprint agar Tidak Hilang */
        .btn-ui {
            position: absolute;
            z-index: 15;
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-ui:active { background: rgba(255, 255, 255, 0.6); }

        /* Posisi Cadangan Sebelum JSON Terbaca */
        #gallery_preview {
            bottom: 20px;
            left: 20px;
            width: 55px;
            height: 55px;
            background: #333;
            background-size: cover;
            background-position: center;
        }

        #shutter_btn {
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 68px;
            height: 68px;
            background: #ffffff;
            border: 4px solid rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 0 4px #ffffff;
        }
        #shutter_btn:active { background: #cccccc; }

        #right_actions_container {
            position: absolute;
            bottom: 15px;
            right: 20px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #switch_camera, #switch_mode {
            position: relative; /* Ikut container flex */
            width: 45px;
            height: 45px;
        }

        #timer_btn {
            top: 30%;
            left: 20px;
            width: 45px;
            height: 45px;
        }

        #expSlider {
            position: absolute;
            top: 55%;
            left: 20px;
            z-index: 10;
            transform: rotate(-90deg);
            transform-origin: left center;
            width: 150px;
            accent-color: #2196F3;
        }

        #triple_dot_btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            font-size: 28px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 5px;
        }

        /* Dropdown Menu Titik Tiga */
        #dropdownMenu {
            position: absolute;
            top: 60px;
            right: 15px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            padding: 8px;
            width: 250px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: none;
            max-height: 50vh;
            overflow-y: auto;
        }

        .menu-parent-label {
            padding: 8px;
            font-weight: bold;
            color: #2196F3;
            border-bottom: 1px solid #222;
            margin-top: 6px;
        }

        .menu-item-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: none;
            border: none;
            color: #fff;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
        }
        .menu-item-btn:hover, .menu-item-btn:active {
            background: #2196F3;
        }
    </style>
</head>
<body>

    <video id="camera-view" autoplay playsinline class="stable-text"></video>

    <button id="gallery_preview" class="btn-ui"></button>
    <button id="shutter_btn" class="btn-ui"></button>

    <div id="right_actions_container">
        <button id="switch_camera" class="btn-ui">🔄</button>
        <button id="switch_mode" class="btn-ui">📸</button>
    </div>

    <button id="timer_btn" class="btn-ui">⏱️</button>
    <input type="range" id="expSlider" min="-3" max="3" step="0.5" value="0">

    <button id="triple_dot_btn" class="stable-text">⋮</button>
    <div id="dropdownMenu"></div>

    <canvas id="capture-canvas" style="display:none;"></canvas>

    <script>
        const appMemory = {
            blueprint: null,
            stream: null,
            currentFacingMode: "environment",
            cameraHistoryThumbs: []
        };

        // AMBIL BLUEPRINT JSON (Dengan Pengaman Ganda)
        fetch('kamus.json?v=' + Date.now())
            .then(res => res.json())
            .then(data => {
                appMemory.blueprint = data;
                applyBlueprintUI();
                startCamera();
            })
            .catch(err => {
                console.warn("Gagal sinkron JSON terbaru dari GitHub, menggunakan UI default:", err);
                // Jika berkas kamus.json belum di-upload, kamera tetap dipaksa jalan dengan tombol bawaan
                startCamera();
            });

        // TERAPKAN UI BERDASARKAN BLUEPRINT JSON SECARA DINAMIS
        function applyBlueprintUI() {
            if (!appMemory.blueprint) return;
            const bp = appMemory.blueprint.navigation_buttons;
            
            document.title = appMemory.blueprint.app_metadata.application_name || "Kamera Web";

            // Atur ulang posisi berdasarkan JSON jika berhasil di-load
            const gal = document.getElementById('gallery_preview');
            Object.assign(gal.style, bp.left_bottom.ui_coordinate);
            gal.style.width = bp.left_bottom.ui_coordinate.width_px + 'px';
            gal.style.height = bp.left_bottom.ui_coordinate.height_px + 'px';

            const shut = document.getElementById('shutter_btn');
            Object.assign(shut.style, bp.center_bottom.ui_coordinate);
            shut.style.width = bp.center_bottom.ui_coordinate.width_px + 'px';
            shut.style.height = bp.center_bottom.ui_coordinate.height_px + 'px';

            const rContainer = document.getElementById('right_actions_container');
            Object.assign(rContainer.style, bp.right_bottom_group.ui_coordinate);
            rContainer.style.gap = bp.right_bottom_group.ui_coordinate.gap_px + 'px';

            const btnCam = document.getElementById('switch_camera');
            btnCam.innerText = bp.right_bottom_group.buttons[0].label;
            btnCam.style.width = bp.right_bottom_group.buttons[0].width_px + 'px';
            btnCam.style.height = bp.right_bottom_group.buttons[0].height_px + 'px';

            const btnMode = document.getElementById('switch_mode');
            btnMode.innerText = bp.right_bottom_group.buttons[1].label;
            btnMode.style.width = bp.right_bottom_group.buttons[1].width_px + 'px';
            btnMode.style.height = bp.right_bottom_group.buttons[1].height_px + 'px';

            const tBtn = document.getElementById('timer_btn');
            tBtn.innerText = bp.left_mid_controls.timer_button.label;
            Object.assign(tBtn.style, bp.left_mid_controls.timer_button.ui_coordinate);
            tBtn.style.width = bp.left_mid_controls.timer_button.ui_coordinate.width_px + 'px';
            tBtn.style.height = bp.left_mid_controls.timer_button.ui_coordinate.height_px + 'px';

            const slider = document.getElementById('expSlider');
            Object.assign(slider.style, bp.left_mid_controls.brightness_slider.ui_coordinate);

            const dotBtn = document.getElementById('triple_dot_btn');
            Object.assign(dotBtn.style, bp.top_bar_controls.menu_button.ui_coordinate);

            const menuBox = document.getElementById('dropdownMenu');
            Object.assign(menuBox.style, bp.top_bar_controls.dropdown_box.ui_coordinate);
            
            buildDropdownMenu();
        }

        // AKSI TOMBOL UTAMA
        document.getElementById('gallery_preview').onclick = () => alert('Buka Galeri Pratinjau (Maks 5 Slot Memori)');
        document.getElementById('shutter_btn').onclick = () => executeCapture();
        document.getElementById('switch_camera').onclick = () => toggleCameraFacing();
        document.getElementById('triple_dot_btn').onclick = () => toggleMenu();
        document.getElementById('camera-view').onclick = () => { document.getElementById('dropdownMenu').style.display = 'none'; };
        document.getElementById('expSlider').oninput = (e) => applyExposure(e.target.value);

        // MEMBUAT DROPDOWN MENU
        function buildDropdownMenu() {
            const menuBox = document.getElementById('dropdownMenu');
            if (!appMemory.blueprint) return;
            menuBox.innerHTML = '';
            
            appMemory.blueprint.menu_titik_tiga.forEach(group => {
                const label = document.createElement('div');
                label.className = 'menu-parent-label stable-text';
                label.innerText = group.label;
                menuBox.appendChild(label);

                const items = group.sub_menu || group.items || [];
                items.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'menu-item-btn stable-text';
                    btn.innerText = item.label;
                    btn.onclick = () => {
                        if(item.action === "setSharpness") applySharpnessFilter(item.value);
                        menuBox.style.display = 'none';
                    };
                    menuBox.appendChild(btn);
                });
            });
        }

        function toggleMenu() {
            const menu = document.getElementById('dropdownMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        // AKSES HARDWARE KAMERA
        function startCamera() {
            if (appMemory.stream) {
                appMemory.stream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: { facingMode: appMemory.currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    appMemory.stream = stream;
                    document.getElementById('camera-view').srcObject = stream;
                })
                .catch(err => console.log("Menunggu izin kamera hardware: " + err));
        }

        function toggleCameraFacing() {
            appMemory.currentFacingMode = appMemory.currentFacingMode === "user" ? "environment" : "user";
            startCamera();
        }

        // LOGIK BLUEPRINT: ANTI CRASH RAM 2GB
        function executeCapture() {
            const shutterBtn = document.getElementById('shutter_btn');
            shutterBtn.disabled = true;
            shutterBtn.style.opacity = "0.5";

            setTimeout(() => {
                const video = document.getElementById('camera-view');
                const canvas = document.getElementById('capture-canvas');
                const ctx = canvas.getContext('2d');

                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                
                ctx.filter = video.style.filter;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const base64Data = canvas.toDataURL('image/webp', 0.9);

                appMemory.cameraHistoryThumbs.unshift(base64Data);
                if(appMemory.cameraHistoryThumbs.length > 5) appMemory.cameraHistoryThumbs.pop();

                document.getElementById('gallery_preview').style.backgroundImage = `url(${base64Data})`;

                shutterBtn.disabled = false;
                shutterBtn.style.opacity = "1";
            }, 50);
        }

        function applySharpnessFilter(mode) {
            const video = document.getElementById('camera-view');
            if(!appMemory.blueprint) return;
            const modes = appMemory.blueprint.sharpness_modes[mode];
            video.style.filter = (modes && modes.sharpness_filter !== "none") ? modes.sharpness_filter : "none";
        }

        function applyExposure(val) {
            const video = document.getElementById('camera-view');
            const calculatedBrightness = 1 + (val * 0.1);
            video.style.filter = `brightness(${calculatedBrightness})`;
        }

        // REGISTRASI SINKRONISASI PWA LOKAL HP
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
