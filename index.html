<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ai Picture</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <style>
        /* Reset dasar untuk layar hitam penuh */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* Wadah Utama Viewfinder */
        #camera-view { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            z-index: 1; 
        }
        
        /* Elemen tombol sebagai wadah kosong (Z-index harus di atas kamera) */
        .ui-element { 
            position: absolute; 
            z-index: 10; 
            touch-action: none; 
            user-select: none; 
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            outline: none;
        }
        
        /* Canvas untuk pemrosesan AI di balik layar */
        #processing-canvas { display: none; }
    </style>
</head>
<body>
    <video id="camera-view" autoplay playsinline></video>

    <div id="gallery_preview" class="ui-element"></div>
    <div id="shutter_btn" class="ui-element"></div>
    
    <div id="right_actions_container" class="ui-element"></div>
    
    <div id="timer_btn" class="ui-element"></div>
    <input type="range" id="expSlider" class="ui-element">
    <div id="triple_dot_btn" class="ui-element"></div>
    <div id="dropdownMenu"></div>

    <canvas id="processing-canvas"></canvas>

    <script src="database.js"></script>
    <script src="brain.js"></script>
</body>
</html>
