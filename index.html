<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ai Picture</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <style>
        /* Reset & dasar */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-drag: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
            position: fixed;
            /* FIX #3: safe area untuk notch HP */
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
        }

        /* Video kamera */
        #camera-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Wadah tombol */
        .ui-element {
            position: absolute;
            z-index: 10;
            touch-action: none;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            outline: none;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
        }

        /* FIX #4: styling untuk icon emoji */
        .icon-art {
            display: inline-block;
            line-height: 1;
            transition: transform 0.3s ease;
            pointer-events: none;   /* ⭐ agar klik tetap kena parent button */
        }

        /* Menu dropdown */
        #dropdownMenu {
            touch-action: pan-y !important;
            user-select: auto !important;
        }

        /* Canvas (hidden) */
        #processing-canvas {
            display: none;
        }
    </style>
</head>
<body>
    <video id="camera-view" autoplay playsinline muted></video>

    <!-- Tombol antarmuka -->
    <button id="gallery_preview" class="ui-element"><span class="icon-art">🖼️</span></button>
    <button id="shutter_btn" class="ui-element"><span class="icon-art">⚪</span></button>

    <div id="right_actions_container" class="ui-element"></div>

    <button id="timer_btn" class="ui-element"><span class="icon-art">⏱️</span></button>

    <div id="left_slider_container" class="ui-element">
        <input type="range" id="expSlider">
    </div>

    <button id="triple_dot_btn" class="ui-element"><span class="icon-art">⋮</span></button>

    <div id="dropdownMenu" class="ui-element"></div>

    <div id="wasm-badge" style="
        position: fixed; top: 15px; left: 15px;
        background: rgba(0, 0, 0, 0.85);
        color: #00e5ff;
        padding: 6px 12px; border-radius: 8px;
        font-size: 12px; font-weight: bold;
        font-family: monospace;
        z-index: 99999;
        display: none;
        border: 1px solid #00e5ff;
    ">-</div>

    <canvas id="processing-canvas"></canvas>

    <!-- Script utama -->
    <script src="./hdr_align.js"></script>
    <script src="./database.js"></script>
    <script src="./brain.js"></script>
    <!-- FIX #2: registrasi Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(() => console.log('✅ SW aktif'))
                .catch((e) => console.warn('SW gagal:', e.message));
        }
    </script>
</body>
</html>
