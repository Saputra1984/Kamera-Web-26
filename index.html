<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ai Picture</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <style>
        /* CSS Reset & Pengunci Stabilitas Layar agar Tidak Goyang saat Disentuh */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Viewfinder Utama Kamera */
        #camera-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            object-fit: cover;
            background: #111;
            transform-origin: center center;
            transition: transform 0.1s ease-out;
        }

        /* Mengamankan elemen agar mutlak diam di memori & tidak memicu seleksi teks biru */
        .stable-text, .btn-ui { 
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* Komponen Tombol UI Bawaan / Cadangan Sebelum JSON Terbaca */
        .btn-ui {
            position: absolute;
            z-index: 15;
            background: rgba(255, 255, 255, 0.25);
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-weight: bold;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-ui:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.6); }

        /* Tombol Galeri Kiri Bawah */
        #gallery_preview {
            bottom: 20px;
            left: 20px;
            width: 55px;
            height: 55px;
            background: #333;
            background-size: cover;
            background-position: center;
        }

        /* Tombol Shutter Utama (Tengah Bawah) */
        #shutter_btn {
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 68px;
            height: 68px;
            background: #ffffff;
            border: 4px solid rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 0 4px #ffffff;
            color: #000;
            font-size: 18px;
        }
        #shutter_btn:active { background: #cccccc; transform: translateX(-50%) scale(0.95); }

        /* Wadah Tombol Kanan Bawah (Kamera Bolak-balik & Mode) */
        #right_actions_container {
            position: absolute;
            bottom: 15px;
            right: 20px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #switch_camera, #switch_mode {
            position: relative; 
            width: 45px;
            height: 45px;
        }

        /* Wadah Kecerahan dan Jepret Waktu Tegak (Portrait) */
        #left_mid_controls {
            position: absolute;
            top: 30%;
            left: 20px;
            z-index: 15;
            display: flex;
            flex-direction: column;
            gap: 15px; 
        }

        /* Slider Bright Bawaan Tegak */
        #expSlider {
            width: 150px;
            accent-color: #2196F3;
            transform: rotate(-90deg);
            transform-origin: left center;
        }

        /* Tombol Jepret Waktu */
        #timer_btn {
            width: 45px;
            height: 45px;
            position: relative; 
        }

        /* Tombol Menu Titik Tiga Kanan Atas */
        #triple_dot_btn {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            font-size: 28px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 5px;
        }

        /* Kotak Dropdown Menu Titik Tiga Elegan */
        #dropdownMenu {
            position: absolute;
            top: 60px;
            right: 15px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #333;
            border-radius: 12px;
            color: white;
            padding: 6px;
            width: 220px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.7);
            display: none;
        }

        .menu-parent-label {
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            color: #2196F3;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #222;
            margin-top: 4px;
        }

        .menu-item-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 12px 10px; 
            background: none;
            border: none;
            color: #fff;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            border-radius: 6px;
        }
        .menu-item-btn:active {
            background: #2196F3;
        }

        /* --- SAKELAR CSS OTOMATIS SAAT LAYAR DIMIRINGKAN (LANDSCAPE) --- */
        @media (orientation: landscape) {
            #left_mid_controls {
                top: 80px;
                right: 20px;
                left: auto;
                width: 200px; 
                flex-direction: row-reverse; 
                align-items: center;
            }
            #expSlider {
                transform: none; 
                width: 100%;     
            }
            #timer_btn {
                width: 45px;
                height: 45px;
            }
        }

        .rotate-icon { transition: transform 0.3s ease-out; }
        .rotated { transform: rotate(90deg); }

        /* Angka Indikator Zoom di Tengah Atas Layar */
        #zoom-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            color: #fff;
            display: none;
        }
    </style>
</head>
<body>

    <video id="camera-view" autoplay playsinline class="stable-text"></video>

    <div id="zoom-indicator" class="stable-text">1.0x</div>

    <button id="gallery_preview" class="btn-ui"></button>
    <button id="shutter_btn" class="btn-ui"></button>

    <div id="right_actions_container">
        <button id="switch_camera" class="btn-ui">🔄</button>
        <button id="switch_mode" class="btn-ui">📸</button>
    </div>

    <div id="left_mid_controls">
        <input type="range" id="expSlider" min="-3" max="3" step="0.5" value="0">
        <button id="timer_btn" class="btn-ui">⏱️</button>
    </div>

    <button id="triple_dot_btn" class="stable-text">⋮</button>
    <div id="dropdownMenu"></div>

    <canvas id="capture-canvas" style="display:none;"></canvas>

    <canvas id="analysis-canvas" width="20" height="20" style="display:none;"></canvas>

    <div id="scrollPickerOverlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:30; display:none; justify-content:center; align-items:flex-end;">
        <div id="scrollPickerBox" style="width:100%; background:#121212; border-radius:16px 16px 0 0; padding:20px; box-shadow:0 -4px 20px rgba(0,0,0,0.5); transform:translateY(100%); transition:transform 0.2s ease-out;">
            <div id="scrollPickerTitle" class="stable-text" style="color:#2196F3; font-weight:bold; font-size:15px; margin-bottom:15px; text-align:center; border-bottom:1px solid #222; padding-bottom:10px;">Pilih Opsi</div>
            <div id="scrollPickerOptionsContainer" style="max-height:40vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px;"></div>
            <button id="closePickerBtn" class="stable-text" style="width:100%; margin-top:15px; padding:12px; background:#222; border:1px solid #333; color:#fff; border-radius:8px; font-weight:bold; cursor:pointer;">Batal</button>
        </div>
    </div>

    <script>
        // 1. MEMORI UTAMA (State Pengontrol RAM 2GB)
        const appMemory = {
            blueprint: null,
            stream: null,
            currentFacingMode: "environment",
            cameraHistoryThumbs: [],
            currentMode: "foto",       
            timerOptions: [0, 3, 5, 10],
            timerIndex: 0,             
            mediaRecorder: null,
            recordedChunks: [],
            isVideoRecording: false,
            defaultFormatFoto: "webp_max",
            defaultFormatVideo: "video_webm",
            activeSharpnessMode: "max", 
            activeColorMode: "natural", 
            exposureLoopInterval: null,
            
            // MEMORI SISTEM INTERAKSI ZOOM
            currentZoom: 1,
            maxZoom: 4,                  
            startTouchDist: 0            
        };

        // 2. INTERAKSI TOMBOL TIMER (Siklus Opsi Berputar)
        document.getElementById('timer_btn').onclick = () => {
            appMemory.timerIndex = (appMemory.timerIndex + 1) % appMemory.timerOptions.length;
            const detikAktif = appMemory.timerOptions[appMemory.timerIndex];
            document.getElementById('timer_btn').innerText = detikAktif === 0 ? "⏱️" : `⏱️ ${detikAktif}s`;
        };

        // 3. INTERAKSI TOMBOL SWITCH MODE
        document.getElementById('switch_mode').onclick = () => {
            const shutterBtn = document.getElementById('shutter_btn');
            if (appMemory.currentMode === "foto") {
                appMemory.currentMode = "video";
                document.getElementById('switch_mode').innerText = "📹";
                shutterBtn.style.backgroundColor = "#ff3b30"; 
                startCamera(true);
            } else {
                appMemory.currentMode = "foto";
                document.getElementById('switch_mode').innerText = "📸";
                shutterBtn.style.backgroundColor = "#ffffff"; 
                startCamera(false);
            }
        };

        // 4. INTERAKSI TOMBOL PRATINJAU FOTO (GALLERY PREVIEW)
        document.getElementById('gallery_preview').onclick = () => {
            const galBtn = document.getElementById('gallery_preview');
            if (appMemory.currentMode === "video" && galBtn.dataset.lastVideo) {
                window.open(galBtn.dataset.lastVideo);
            } else if (appMemory.cameraHistoryThumbs.length > 0) {
                const imageWindow = window.open();
                imageWindow.document.write(`<img src="${appMemory.cameraHistoryThumbs[0]}" style="width:100%; height:100%; object-fit:contain; background:#000; margin:0;">`);
            } else {
                alert("Belum ada jepretan foto atau rekaman video di memori.");
            }
        };

        // 5. AMBIL BLUEPRINT JSON (Anti-Cache)
        fetch('kamus.json?v=' + Date.now())
            .then(res => res.json())
            .then(data => {
                appMemory.blueprint = data;
                applyBlueprintUI();
                
                if (data.settings) {
                    if (data.settings.default_format) appMemory.defaultFormatFoto = data.settings.default_format;
                    if (data.settings.default_sharpness) appMemory.activeSharpnessMode = data.settings.default_sharpness;
                    if (data.settings.default_color_mode) {
                        appMemory.activeColorMode = data.settings.default_color_mode;
                        applyColorModeFilter(data.settings.default_color_mode);
                    }
                }
                startCamera(false);
                initAutoExposureLoop(); // Jalankan mesin penyesuai cahaya otomatis
            })
            .catch(err => {
                console.warn("Gagal sinkron JSON terbaru, menggunakan UI default:", err);
                startCamera(false);
            });

        // 6. TERAPKAN UI BERDASARKAN BLUEPRINT JSON SECARA DINAMIS
        function applyBlueprintUI() {
            if (!appMemory.blueprint) return;
            const bp = appMemory.blueprint.navigation_buttons;
            
            document.title = appMemory.blueprint.app_metadata.application_name || "Ai Picture";

            const gal = document.getElementById('gallery_preview');
            Object.assign(gal.style, bp.left_bottom.ui_coordinate);
            gal.style.width = bp.left_bottom.ui_coordinate.width_px + 'px';
            gal.style.height = bp.left_bottom.ui_coordinate.height_px + 'px';

            const shut = document.getElementById('shutter_btn');
            Object.assign(shut.style, bp.center_bottom.ui_coordinate);
            shut.style.transform = "translateX(-50%)"; 
            shut.style.width = bp.center_bottom.ui_coordinate.width_px + 'px';
            shut.style.height = bp.center_bottom.ui_coordinate.height_px + 'px';

            const rContainer = document.getElementById('right_actions_container');
            Object.assign(rContainer.style, bp.right_bottom_group.ui_coordinate);
            rContainer.style.gap = bp.right_bottom_group.ui_coordinate.gap_px + 'px';

            const btnCam = document.getElementById('switch_camera');
            btnCam.innerText = bp.right_bottom_group.buttons[0].label;
            btnCam.style.width = bp.right_bottom_group.buttons[0].width_px + 'px';
            btnCam.style.height = bp.right_bottom_group.buttons[0].height_px + 'px';

            const btnMode = document.getElementById('switch_mode');
            btnMode.innerText = bp.right_bottom_group.buttons[1].label;
            btnMode.style.width = bp.right_bottom_group.buttons[1].width_px + 'px';
            btnMode.style.height = bp.right_bottom_group.buttons[1].height_px + 'px';

            const tBtn = document.getElementById('timer_btn');
            tBtn.innerText = bp.left_mid_controls.timer_button.label;
            tBtn.style.width = bp.left_mid_controls.timer_button.ui_coordinate.width_px + 'px';
            tBtn.style.height = bp.left_mid_controls.timer_button.ui_coordinate.height_px + 'px';

            if (appMemory.blueprint.camera_features?.timer_options) {
                appMemory.timerOptions = appMemory.blueprint.camera_features.timer_options;
            }
            if (appMemory.blueprint.camera_features?.zoom?.extreme_digital_multiplier) {
                appMemory.maxZoom = appMemory.blueprint.camera_features.zoom.extreme_digital_multiplier;
            }

            buildDropdownMenu();
        }

        // 7. HUBUNGAN TOMBOL FISIK & WINDOWS EVENT
        document.getElementById('shutter_btn').onclick = () => executeCapture();
        document.getElementById('switch_camera').onclick = () => toggleCameraFacing();
        document.getElementById('triple_dot_btn').onclick = () => toggleMenu();
        document.getElementById('camera-view').onclick = () => { document.getElementById('dropdownMenu').style.display = 'none'; };
        document.getElementById('expSlider').oninput = (e) => applyExposure(e.target.value);

        // 8. LOGIKA PINCH-TO-ZOOM
        const videoEl = document.getElementById('camera-view');
        
        videoEl.addEventListener('touchstart', (e) => {
            if (e.touches.length === 2) {
                appMemory.startTouchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
            }
        });

        videoEl.addEventListener('touchmove', (e) => {
            if (e.touches.length === 2 && appMemory.startTouchDist > 0) {
                const currentDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                
                const factor = currentDist / appMemory.startTouchDist;
                let newZoom = appMemory.currentZoom * factor;
                newZoom = Math.max(1, Math.min(newZoom, appMemory.maxZoom));
                
                videoEl.style.transform = `scale(${newZoom})`;
                
                const indicator = document.getElementById('zoom-indicator');
                indicator.style.display = "block";
                indicator.innerText = `${newZoom.toFixed(1)}x`;
                
                appMemory.currentZoom = newZoom;
                appMemory.startTouchDist = currentDist;
            }
        });

        videoEl.addEventListener('touchend', () => {
            appMemory.startTouchDist = 0;
            setTimeout(() => {
                if(appMemory.startTouchDist === 0) {
                    document.getElementById('zoom-indicator').style.display = "none";
                }
            }, 1500);
        });

        // 9. REVOLUSI MENU TITIK TIGA: SINKRON TOTAL PATUH PADA BLUEPRINT JSON
        function buildDropdownMenu() {
            const menuBox = document.getElementById('dropdownMenu');
            if (!appMemory.blueprint || !appMemory.blueprint.menu_titik_tiga) return;
            menuBox.innerHTML = ''; 

            appMemory.blueprint.menu_titik_tiga.forEach(grup => {
                const label = document.createElement('div');
                label.className = 'menu-parent-label stable-text';
                label.innerText = grup.label;
                menuBox.appendChild(label);

                if (grup.type === "parent_menu" && grup.sub_menu) {
                    const btnUtama = document.createElement('button');
                    btnUtama.className = 'menu-item-btn stable-text';
                    btnUtama.innerHTML = `<span>Buka ${grup.label.split(' ').slice(1).join(' ')}</span> <span>❯</span>`;
                    
                    btnUtama.onclick = () => {
                        const daftarOpsiGulir = grup.sub_menu.map(sub => {
                            return { label: sub.label, value: sub.value };
                        });

                        tampilkanPopUpGulir(grup.label.toUpperCase(), daftarOpsiGulir, (nilai, teksLabel) => {
                            if (grup.id === "group_foto") {
                                appMemory.defaultFormatFoto = nilai; 
                            } else if (grup.id === "group_video") {
                                appMemory.defaultFormatVideo = nilai;
                            } else if (grup.id === "group_sharpness") {
                                applySharpnessFilter(nilai);
                            }
                            alert(`Berhasil diset: ${teksLabel}`);
                        });
                        menuBox.style.display = 'none';
                    };
                    menuBox.appendChild(btnUtama);
                }

                if (grup.type === "direct_menu" && grup.items) {
                    grup.items.forEach(item => {
                        const btnLangsung = document.createElement('button');
                        btnLangsung.className = 'menu-item-btn stable-text';
                        btnLangsung.innerHTML = `<span>${item.label}</span> <span>🎯</span>`;
                        
                        btnLangsung.onclick = () => {
                            if (item.action === "setColorMode") {
                                applyColorModeFilter(item.value);
                                alert(`Mode Warna diatur ke: ${item.label}`);
                            } else if (item.action === "setAntiGlare") {
                                setAntiGlareMode(item.value);
                            } else if (item.action === "toggleStability") {
                                alert("🛡️ Kamera Stabil Aktif: Mengunci koordinat getaran lensa.");
                            } else if (item.action === "toggleFocusBox") {
                                alert("🎯 Kotak Kunci Fokus diaktifkan di area tengah kamera.");
                            }
                            menuBox.style.display = 'none';
                        };
                        menuBox.appendChild(btnLangsung);
                    });
                }
            });
        }

        // Fungsi Pop-up Gulir Kustom (Bottom Sheet Premium)
        function tampilkanPopUpGulir(judul, daftarOpsi, aksiPilihan) {
            const overlay = document.getElementById('scrollPickerOverlay');
            const box = document.getElementById('scrollPickerBox');
            const title = document.getElementById('scrollPickerTitle');
            const container = document.getElementById('scrollPickerOptionsContainer');

            title.innerText = judul;
            container.innerHTML = ''; 

            daftarOpsi.forEach(opsi => {
                const btn = document.createElement('button');
                btn.className = 'stable-text';
                btn.innerText = opsi.label;
                
                Object.assign(btn.style, {
                    width: '100%', padding: '14px', background: '#1c1c1e', border: 'none',
                    color: '#fff', textAlign: 'center', fontSize: '15px', borderRadius: '8px', cursor: 'pointer'
                });

                btn.onclick = () => {
                    aksiPilihan(opsi.value, opsi.label);
                    tutupPopUpGulir();
                };
                container.appendChild(btn);
            });

            overlay.style.display = 'flex';
            setTimeout(() => { box.style.transform = 'translateY(0)'; }, 10);
        }

        function tutupPopUpGulir() {
            const overlay = document.getElementById('scrollPickerOverlay');
            const box = document.getElementById('scrollPickerBox');
            box.style.transform = 'translateY(100%)';
            setTimeout(() => { overlay.style.display = 'none'; }, 200);
        }

        document.getElementById('closePickerBtn').onclick = tutupPopUpGulir;
        document.getElementById('scrollPickerOverlay').onclick = (e) => {
            if(e.target === document.getElementById('scrollPickerOverlay')) tutupPopUpGulir();
        };

        function toggleMenu() {
            const menu = document.getElementById('dropdownMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        // 10. AKSES HARDWARE KAMERA HP ASLI
        function startCamera(needsAudio = false) {
            if (appMemory.stream) {
                appMemory.stream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: { facingMode: appMemory.currentFacingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: needsAudio 
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    appMemory.stream = stream;
                    document.getElementById('camera-view').srcObject = stream;
                })
                .catch(err => console.log("Izin hardware: " + err));
        }

        function toggleCameraFacing() {
            appMemory.currentFacingMode = appMemory.currentFacingMode === "user" ? "environment" : "user";
            const audioStatus = appMemory.currentMode === "video";
            startCamera(audioStatus);
        }

        // 11. LOGIK MANAJEMEN SHUTTER (Timer Hitung Mundur)
        function executeCapture() {
            const shutterBtn = document.getElementById('shutter_btn');
            const detikTunggu = appMemory.timerOptions[appMemory.timerIndex];

            if (detikTunggu > 0 && !appMemory.isVideoRecording) {
                let hitung = detikTunggu;
                shutterBtn.disabled = true;
                
                const interval = setInterval(() => {
                    shutterBtn.innerText = hitung;
                    hitung--;
                    if (hitung < 0) {
                        clearInterval(interval);
                        shutterBtn.innerText = "";
                        shutterBtn.disabled = false;
                        jalankanAksiUtama(); 
                    }
                }, 1000);
            } else {
                jalankanAksiUtama();
            }
        }

        function jalankanAksiUtama() {
            if (appMemory.currentMode === "foto") {
                ambilFotoWebp();
            } else {
                kontrolPerekamanVideo();
            }
        }

        // ============================================================
        // 12. MESIN INTI: AMBIL FOTO + SMOOTH & EXTREME DETAIL BILINEAR FILTER
        // ============================================================
        function ambilFotoWebp() {
            const shutterBtn = document.getElementById('shutter_btn');
            
            // Implementasi blueprint: anti_crash_loading untuk RAM 2GB
            shutterBtn.disabled = true;
            shutterBtn.innerText = '📸...'; 
        
            const video = document.getElementById('camera-view');
            const canvas = document.getElementById('capture-canvas') || document.createElement('canvas');
            canvas.id = 'capture-canvas';
            const ctx = canvas.getContext('2d');
        
            const w = video.videoWidth || 640;
            const h = video.videoHeight || 480;
            canvas.width = w;
            canvas.height = h;
        
            // Memori penampung frame sementara (Maksimal 3 frame sesuai batasan hardware_assisted)
            let frameBuffer = [];
            let currentFrameCount = 0;
            const totalBurstFrames = 3; 
        
            // Siklus burst kilat 15ms memanfaatkan micro-shaking alami tangan untuk efek 2.5D
            const burstInterval = setInterval(() => {
                if (currentFrameCount < totalBurstFrames) {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = w;
                    tempCanvas.height = h;
                    const tempCtx = tempCanvas.getContext('2d');
                    
                    // Terapkan filter warna aktif (natural, malam, teks, dll) dari metadata
                    tempCtx.filter = window.getComputedStyle(video).filter || video.style.filter;
        
                    // Ambil koordinat zoom digital (extreme_digital_multiplier)
                    const z = appMemory.currentZoom || 1;
                    const sw = w / z;
                    const sh = h / z;
                    const sx = (w - sw) / 2;
                    const sy = (h - sh) / 2;
        
                    tempCtx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
                    frameBuffer.push(tempCtx.getImageData(0, 0, w, h));
                    currentFrameCount++;
                } else {
                    clearInterval(burstInterval);
                    // Masuk ke pemrosesan komputasi fotografi
                    setTimeout(() => {
                        prosesPemadatanMataManusia(frameBuffer, w, h);
                    }, 10);
                }
            }, 15); 

            // SUB-FUNGSI 1: Memadatkan 3 Frame dengan Rumus dari JSON Blueprint
            function prosesPemadatanMataManusia(buffers, w, h) {
                const outputData = ctx.createImageData(w, h);
                const outPixels = outputData.data;
            
                const f1 = buffers[0].data;
                const f2 = buffers[1].data;
                const f3 = buffers[2].data;
            
                // 1. Ambil konfigurasi ketajaman & rumus mata dari JSON
                const activeMode = appMemory.activeSharpnessMode || 'max';
                const cfgSharp = {
                    "low": { "level": 3, "contrast_assist": 1.02 },
                    "standar": { "level": 5, "contrast_assist": 1.05 },
                    "max": { "level": 10, "contrast_assist": 1.10 }
                }[activeMode];
            
                const kekuatanSharp = cfgSharp ? (cfgSharp.level * 0.05) : 0.5;
            
                // Ambil parameter rumus mata manusia dari blueprint JSON
                const eyeCfg = appMemory.blueprint?.human_eye_perception_formula || {
                    "luminance_weights_cie1931": { "r": 0.2126, "g": 0.7152, "b": 0.0722 },
                    "tone_mapping": { "trigger_glare_above": 190, "glare_dim_factor": 0.92, "max_clipping_safety": 245 },
                    "gamma_correction": { "curve_exponent": 2.2 }
                };
            
                const wR = eyeCfg.luminance_weights_cie1931.r;
                const wG = eyeCfg.luminance_weights_cie1931.g;
                const wB = eyeCfg.luminance_weights_cie1931.b;
                const gExponent = eyeCfg.gamma_correction.curve_exponent;
                const tGlare = eyeCfg.tone_mapping.trigger_glare_above;
                const dFactor = eyeCfg.tone_mapping.glare_dim_factor;
                const maxSafety = eyeCfg.tone_mapping.max_clipping_safety;
            
                // Ambil konfigurasi teropong dari JSON
                const teleCfg = appMemory.blueprint?.telescope_zoom_formula || {
                    "trigger_zoom_above": 2.0,
                    "subpixel_interpolation": { "enhance_multiplier": 1.45 },
                    "laplacian_edge_booster": { "boost_factor": 1.35 }
                };
            
                const currentZoomLevel = appMemory.currentZoom || 1;
                const isTelescopeActive = currentZoomLevel > teleCfg.trigger_zoom_above;
            
                // LOOPING INTI PER PIKSEL (HANYA BOLEH ADA 1 LOOP UTAMA)
        for (let i = 0; i < f1.length; i += 4) {
            // Rata-rata dasar 3 frame kilat
            let rPadat = (f1[i]   + f2[i]   + f3[i])   / 3;
            let gPadat = (f1[i+1] + f2[i+1] + f3[i+1]) / 3;
            let bPadat = (f1[i+2] + f2[i+2] + f3[i+2]) / 3;

            // JIKA SEDANG POSISI ZOOM JAUH, AKTIFKAN SIMULASI DOUBLE LENSA
            if (isTelescopeActive) {
                // Hitung koordinat posisi piksel relatif terhadap titik tengah layar (0.0 sampai 1.0)
                const totalPiksel = f1.length / 4;
                const idxPiksel = i / 4;
                const pxX = idxPiksel % w;
                const pxY = Math.floor(idxPiksel / w);
                const distKeTengah = Math.sqrt(Math.pow(pxX - w/2, 2) + Math.pow(pxY - h/2, 2)) / Math.sqrt(Math.pow(w/2, 2) + Math.pow(h/2, 2));

                // --------------------------------------------------------
                // SIMULASI LENSA 1: CEKUNG DEPAN (Menyebarkan Cahaya & Silau)
                // --------------------------------------------------------
                const ccv = teleCfg.front_concave_lens || { "layers": 3, "base_curvature": -0.06, "thickness_per_layer": 0.12, "glare_dispersion_factor": 0.85 };
                
                // Menghitung total efek akumulasi dari jumlah lapisan cekung
                let efekCekungTotal = ccv.base_curvature * ccv.layers * ccv.thickness_per_layer;
                
                // Sifat cekung: meredam intensitas piksel di area tengah yang terlalu dominan akibat silau
                let faktorCekung = 1 + (distKeTengah * efekCekungTotal);
                rPadat *= (faktorCekung * ccv.glare_dispersion_factor);
                gPadat *= (faktorCekung * ccv.glare_dispersion_factor);
                bPadat *= (faktorCekung * ccv.glare_dispersion_factor);

                // --------------------------------------------------------
                // SIMULASI LENSA 2: CEMBUNG BELAKANG (Memadatkan & Menajamkan)
                // --------------------------------------------------------
                const cvx = teleCfg.back_convex_lens || { "layers": 2, "base_curvature": 0.08, "thickness_per_layer": 0.15, "center_focus_booster": 1.40 };
                
                // Menghitung total efek akumulasi dari jumlah lapisan cembung
                let efekCembungTotal = cvx.base_curvature * cvx.layers * cvx.thickness_per_layer;
                
                // Sifat cembung: menaikkan ketajaman mikro (Laplacian) secara terpusat
                const boostEdge = teleCfg.laplacian_edge_booster.boost_factor;
                let faktorCembung = 1 + ((1 - distKeTengah) * efekCembungTotal * cvx.center_focus_booster);

                let diffR = (f1[i]   - rPadat) * boostEdge * faktorCembung;
                let diffG = (f1[i+1] - gPadat) * boostEdge * faktorCembung;
                let diffB = (f1[i+2] - bPadat) * boostEdge * faktorCembung;

                const teleMultiplier = teleCfg.subpixel_interpolation.enhance_multiplier;
                rPadat = rPadat + (diffR * teleMultiplier * (currentZoomLevel * 0.25));
                gPadat = gPadat + (diffG * teleMultiplier * (currentZoomLevel * 0.25));
                bPadat = bPadat + (diffB * teleMultiplier * (currentZoomLevel * 0.25));

                // --------------------------------------------------------
                // LOGIKA TAMBAHAN: TEMBUS JENDELA (MENEMBUS REFLEKSI KACA)
                // --------------------------------------------------------
                const winCfg = teleCfg.window_penetration || { "glare_reflection_cut": 200, "shadow_detail_boost": 1.30 };
                if (rPadat > winCfg.glare_reflection_cut && bPadat > winCfg.glare_reflection_cut) {
                    rPadat *= 0.85; 
                    gPadat *= 0.88;
                } else {
                    rPadat = Math.min(255, rPadat * winCfg.shadow_detail_boost);
                    gPadat = Math.min(255, gPadat * winCfg.shadow_detail_boost);
                    bPadat = Math.min(255, bPadat * winCfg.shadow_detail_boost);
                }
            }

                    // TAHAP B: NORMALISASI DAN TONE MAPPING MATA MANUSIA
                    let rNorm = rPadat / 255;
                    let gNorm = gPadat / 255;
                    let bNorm = bPadat / 255;
            
                    let luminanceMata = (wR * rNorm) + (wG * gNorm) + (wB * bNorm);
            
                    let pemetaanTonasi = luminanceMata / (1.0 + luminanceMata);
                    if (luminanceMata > 0) {
                        rNorm = (rNorm / luminanceMata) * pemetaanTonasi;
                        gNorm = (gNorm / luminanceMata) * pemetaanTonasi;
                        bNorm = (bNorm / luminanceMata) * pemetaanTonasi;
                    }
            
                    // TAHAP C: GAMMA CORRECTION PERSEPSI VISUAL BIOLOGIS
                    rNorm = Math.pow(rNorm, 1 / gExponent);
                    gNorm = Math.pow(gNorm, 1 / gExponent);
                    bNorm = Math.pow(bNorm, 1 / gExponent);
            
                    rPadat = rNorm * 255;
                    gPadat = gNorm * 255;
                    bPadat = bNorm * 255;
            
                    // TAHAP D: REDAM SILAU LOKAL (ANTI-GLARE)
                    const brightnessAsli = (wR * (f1[i]/255)) + (wG * (f1[i+1]/255)) + (wB * (f1[i+2]/255)) * 255;
            
                    if (brightnessAsli > tGlare) {
                        const faktorSilau = (brightnessAsli - tGlare) / (255 - tGlare);
                        const pikselTerbaikR = Math.min(f1[i], f2[i], f3[i]);
                        const pikselTerbaikG = Math.min(f1[i+1], f2[i+1], f3[i+1]);
                        const pikselTerbaikB = Math.min(f1[i+2], f2[i+2], f3[i+2]);
            
                        rPadat = ((rPadat * (1 - faktorSilau)) + (pikselTerbaikR * faktorSilau)) * dFactor;
                        gPadat = ((gPadat * (1 - faktorSilau)) + (pikselTerbaikG * faktorSilau)) * dFactor;
                        bPadat = ((bPadat * (1 - faktorSilau)) + (pikselTerbaikB * faktorSilau)) * dFactor;
                    }
            
                    // TAHAP E: SUNTIK KETAJAMAN KONTRAST 2.5D FINAL
                    let rFinal = rPadat + ((f1[i]   - rPadat) * kekuatanSharp);
                    let gFinal = gPadat + ((f1[i+1] - gPadat) * kekuatanSharp);
                    let bFinal = bPadat + ((f1[i+2] - bPadat) * kekuatanSharp);
            
                    // Kunci ke angka aman anti-clipping
                    outPixels[i]   = Math.max(0, Math.min(maxSafety, rFinal));
                    outPixels[i+1] = Math.max(0, Math.min(maxSafety, gFinal));
                    outPixels[i+2] = Math.max(0, Math.min(maxSafety, bFinal));
                    outPixels[i+3] = f1[i+3]; // Alpha murni
                }
            
                // Terapkan data piksel matang ke kanvas
                ctx.putImageData(outputData, 0, 0);
            
                // EFEK OVERLAY LAYER (MASKING & DIMENSI)
                // 1. IMPLEMENTASI RUMUS: SQUINT REFLEX (DAHI MENGKERUT / SQUINTING)
                const squintCfg = eyeCfg.squint_reflex_mechanism;
                if (squintCfg && squintCfg.enabled) {
                    let totalPikselSilau = 0;
                    const totalPiksel = f1.length / 4;
            
                    for (let j = 0; j < f1.length; j += 16) { 
                        const luma = (wR * f1[j]) + (wG * f1[j+1]) + (wB * f1[j+2]);
                        if (luma > tGlare) totalPikselSilau++;
                    }
            
                    const persentaseSilau = totalPikselSilau / (totalPiksel / 4);
            
                    if (persentaseSilau > squintCfg.trigger_total_glare_pct) {
                        const gradientMata = ctx.createLinearGradient(0, 0, 0, h);
                        const vAlpha = squintCfg.vignette_shadow_alpha;
            
                        gradientMata.addColorStop(0, `rgba(0, 0, 0, ${vAlpha})`);
                        gradientMata.addColorStop(0.15, `rgba(0, 0, 0, ${vAlpha * 0.4})`);
                        gradientMata.addColorStop(0.5, 'rgba(0, 0, 0, 0)');
                        gradientMata.addColorStop(0.85, `rgba(0, 0, 0, ${vAlpha * 0.4})`);
                        gradientMata.addColorStop(1, `rgba(0, 0, 0, ${vAlpha})`);
            
                        ctx.globalCompositeOperation = 'source-over';
                        ctx.fillStyle = gradientMata;
                        ctx.fillRect(0, 0, w, h);
            
                        ctx.globalCompositeOperation = 'overlay';
                        ctx.fillStyle = `rgba(255, 255, 255, ${(squintCfg.center_sharpness_boost - 1).toFixed(3)})`;
                        ctx.beginPath();
                        ctx.arc(w / 2, h / 2, Math.min(w, h) * 0.35, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.globalCompositeOperation = 'source-over';
                    }
                }
            
                // 2. IMPLEMENTASI RUMUS: TUNNEL VISION ANTI-GLARE (ISOLASI MATA TEROPONG)
                if (teleCfg && teleCfg.tunnel_vision_isolation?.enabled && currentZoomLevel > teleCfg.trigger_zoom_above) {
                    const tunnelIso = teleCfg.tunnel_vision_isolation;
                    const cx = w / 2;
                    const cy = h / 2;
                    const maxRadius = Math.sqrt(cx*cx + cy*cy);
                    const innerRadius = maxRadius * tunnelIso.fovea_focus_radius_pct;
            
                    const topengTeropong = ctx.createRadialGradient(cx, cy, innerRadius, cx, cy, maxRadius);
                    topengTeropong.addColorStop(0, 'rgba(0,0,0,0)');
                    topengTeropong.addColorStop(tunnelIso.tunnel_smoothness_gradient, 'rgba(0,0,0,0.05)');
                    topengTeropong.addColorStop(1, `rgba(0, 0, 0, ${tunnelIso.peripheral_light_suppression})`);
            
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.fillStyle = topengTeropong;
                    ctx.fillRect(0, 0, w, h);
                }
            
                // 3. SENTUHAN AKHIR: Efek bayangan mikro 2.5D kontras asisten
                const contrastAssist = cfgSharp ? cfgSharp.contrast_assist : 1.10;
                ctx.globalCompositeOperation = 'soft-light';
                ctx.fillStyle = `rgba(0,0,0,${(contrastAssist - 1).toFixed(3)})`; 
                ctx.fillRect(0, 0, w, h);
                ctx.globalCompositeOperation = 'source-over';
            
                // Eksekusi auto-download hasil akhir tunggal
                simpanDanDownloadHasil(canvas);
            } // <--- PENUTUP prosesPemadatanMataManusia YANG BENAR

            // SUB-FUNGSI 2: Penyimpanan data gambar
            function simpanDanDownloadHasil(finalCanvas) {
                const formatTerpilih = appMemory.defaultFormatFoto || 'webp_max';
                let mimeType = 'image/webp';
                let ekstensi = 'webp';
                let kualitas = 0.92;
        
                if (formatTerpilih === 'webp_max') {
                    mimeType = 'image/webp'; ekstensi = 'webp'; kualitas = 1.0; 
                } else if (formatTerpilih === 'jpeg_hr' || formatTerpilih === 'image/jpeg') {
                    mimeType = 'image/jpeg'; ekstensi = 'jpg'; kualitas = 1.0;
                } else if (formatTerpilih === 'png') {
                    mimeType = 'image/png'; ekstensi = 'png';
                }
        
                const base64Data = finalCanvas.toDataURL(mimeType, kualitas);
        
                if (!appMemory.cameraHistoryThumbs) appMemory.cameraHistoryThumbs = [];
                appMemory.cameraHistoryThumbs.unshift(base64Data);
                if (appMemory.cameraHistoryThumbs.length > 5) appMemory.cameraHistoryThumbs.pop();
        
                const galleryPreview = document.getElementById('gallery_preview');
                if (galleryPreview) {
                    galleryPreview.style.backgroundImage = `url(${base64Data})`;
                    galleryPreview.style.backgroundSize = 'cover';
                }
        
                const linkDownload = document.createElement('a');
                linkDownload.href = base64Data;
                
                const waktu = new Date();
                const penandaWaktu = `${waktu.getFullYear()}${String(waktu.getMonth()+1).padStart(2,'0')}${String(waktu.getDate()).padStart(2,'0')}_${String(waktu.getHours()).padStart(2,'0')}${String(waktu.getMinutes()).padStart(2,'0')}${String(waktu.getSeconds()).padStart(2,'0')}`;
                
                linkDownload.download = `Ai_Picture_${penandaWaktu}.${ekstensi}`;
                document.body.appendChild(linkDownload);
                linkDownload.click();
                document.body.removeChild(linkDownload);
        
                shutterBtn.disabled = false;
                shutterBtn.innerText = '';
            }
        } // <--- PENUTUP SEJATI FUNGSI UTAMA ambilFotoWebp

        // ============================================================
        // 13. LOGIK BLUEPRINT PEREKAMAN VIDEO
        // ============================================================
        function kontrolPerekamanVideo() {
            const shutterBtn = document.getElementById('shutter_btn');
            if (!appMemory.isVideoRecording) {
                appMemory.recordedChunks = [];
                let opsiMime = "video/webm";
                if (appMemory.defaultFormatVideo === "video_mp4" && MediaRecorder.isTypeSupported("video/mp4")) {
                    opsiMime = "video/mp4";
                }

                try {
                    appMemory.mediaRecorder = new MediaRecorder(appMemory.stream, { mimeType: opsiMime });
                } catch(e) {
                    appMemory.mediaRecorder = new MediaRecorder(appMemory.stream);
                }

                appMemory.mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) appMemory.recordedChunks.push(e.data);
                };

                appMemory.mediaRecorder.onstop = () => {
                    const blob = new Blob(appMemory.recordedChunks, { type: appMemory.mediaRecorder.mimeType });
                    const videoURL = URL.createObjectURL(blob);
                    document.getElementById('gallery_preview').dataset.lastVideo = videoURL;
                    document.getElementById('gallery_preview').style.backgroundImage = "url('https://cdn-icons-png.flaticon.com/512/685/685655.png')"; 
                    alert("Video berhasil disimpan secara aman ke memori!");
                };

                appMemory.mediaRecorder.start();
                appMemory.isVideoRecording = true;
                shutterBtn.innerText = "🛑"; 
            } else {
                appMemory.mediaRecorder.stop();
                appMemory.isVideoRecording = false;
                shutterBtn.innerText = "";
            }
        }

        // ============================================================
        // 14. LOGIKA MENYALIN STRUKTUR ASLI KAMUS.JSON
        // ============================================================
        function applySharpnessFilter(modeKey) {
            appMemory.activeSharpnessMode = modeKey;
        }

        function applyColorModeFilter(colorKey) {
            appMemory.activeColorMode = colorKey;
            executeExposureStabilizer(); 
        }

        function applyExposure(val) {
            const calculatedBrightness = 1 + (val * 0.1);
            const videoEl = document.getElementById('camera-view');
            if(videoEl) videoEl.style.filter = `brightness(${calculatedBrightness})`;
        }

        appMemory.activeAntiGlareMode = "normal"; 
        
        function setAntiGlareMode(modeKey) {
            appMemory.activeAntiGlareMode = modeKey;
            
            const video = document.getElementById('camera-view');
            let baseFilter = "saturate(1.0) contrast(1.0)";
            if (appMemory.blueprint?.camera_features?.color_filters && appMemory.blueprint.camera_features.color_filters[appMemory.activeColorMode]) {
                baseFilter = appMemory.blueprint.camera_features.color_filters[appMemory.activeColorMode];
            }
            video.style.filter = baseFilter;
        
            if (modeKey === "jendela") {
                alert("🪟 Kamera dipetakan untuk Jendela. Meredam backlight & silau luar.");
            } else if (modeKey === "kain") {
                alert("👕 Kamera dipetakan untuk Kain. Mengunci serat & meredam pantulan lampu.");
            } else {
                alert("🔄 Kamera kembali ke Mode Normal.");
            }
            
            if (typeof executeExposureStabilizer === "function") {
                executeExposureStabilizer();
            }
        }

        // ============================================================
        // MESIN TAMBAHAN: REAL-TIME LUMINANCE ANALYSIS (SMART EXPOSURE)
        // ============================================================
        function initAutoExposureLoop() {
            if (appMemory.exposureLoopInterval) clearInterval(appMemory.exposureLoopInterval);
            
            let intervalTime = 200; 
            if (appMemory.blueprint?.auto_exposure_stabilizer?.analysis_interval_ms) {
                intervalTime = appMemory.blueprint.auto_exposure_stabilizer.analysis_interval_ms;
            }

            appMemory.exposureLoopInterval = setInterval(() => {
                if (appMemory.blueprint?.auto_exposure_stabilizer?.enabled && appMemory.stream && !appMemory.isVideoRecording) {
                    executeExposureStabilizer();
                }
            }, intervalTime);
        }

        function executeExposureStabilizer() {
            const video = document.getElementById('camera-view');
            const aCanvas = document.getElementById('analysis-canvas');
            const aCtx = aCanvas.getContext('2d');
        
            if (video.videoWidth === 0 || video.videoHeight === 0) return;
            
            const stabilizerCfg = appMemory.blueprint?.auto_exposure_stabilizer;
            if (!stabilizerCfg || !stabilizerCfg.enabled) return;
        
            if (appMemory.activeAntiGlareMode === "normal") {
                aCtx.drawImage(video, 0, 0, 20, 20);
                const imgData = aCtx.getImageData(0, 0, 20, 20);
                const pixels = imgData.data;
                let totalLumi = 0;
                for (let i = 0; i < pixels.length; i += 4) {
                    totalLumi += (0.299 * pixels[i]) + (0.587 * pixels[i+1]) + (0.114 * pixels[i+2]);
                }
                const avgLumi = totalLumi / (pixels.length / 4);
                
                let baseFilter = stabilizerCfg.conditions.outdoor_bright.adjust_filter; 
                if (avgLumi < stabilizerCfg.conditions.indoor_lowlight.trigger_luminance_below) {
                    baseFilter = stabilizerCfg.conditions.indoor_lowlight.adjust_filter;
                } else if (avgLumi > stabilizerCfg.conditions.outdoor_bright.trigger_luminance_above) {
                    baseFilter = stabilizerCfg.conditions.outdoor_bright.adjust_filter;
                } else {
                    baseFilter = "brightness(1.0) contrast(1.0) saturate(1.0)";
                }
                
                let activeColor = appMemory.blueprint.camera_features.color_filters[appMemory.activeColorMode] || "";
                video.style.filter = `${activeColor} ${baseFilter}`.trim();
                return; 
            }
        
            aCtx.drawImage(video, 0, 0, 20, 20);
            const imgData = aCtx.getImageData(0, 0, 20, 20);
            const pixels = imgData.data;
            
            let overExposedCount = 0;
            let totalPixels = pixels.length / 4;
        
            for (let i = 0; i < pixels.length; i += 4) {
                const luminance = (0.299 * pixels[i]) + (0.587 * pixels[i+1]) + (0.114 * pixels[i+2]);
                const whiteThreshold = stabilizerCfg.conditions.lamp_highlight?.max_white_threshold || 210;
                if (luminance > whiteThreshold) {
                    overExposedCount++;
                }
            }
        
            const glareIntensity = overExposedCount / totalPixels; 
            let dynamicFilter = "";
        
            if (appMemory.activeAntiGlareMode === "jendela") {
                const cfg = stabilizerCfg.conditions.anti_glare_jendela;
                let autoBrightness = cfg.base_brightness - (glareIntensity * cfg.max_dim_offset);
                let autoContrast = cfg.base_contrast + (glareIntensity * cfg.max_contrast_offset);
                dynamicFilter = ` brightness(${autoBrightness.toFixed(2)}) contrast(${autoContrast.toFixed(2)}) saturate(${cfg.saturate})`;
                
            } else if (appMemory.activeAntiGlareMode === "kain") {
                const cfg = stabilizerCfg.conditions.anti_glare_kain;
                let autoBrightness = cfg.base_brightness - (glareIntensity * cfg.max_dim_offset);
                let autoContrast = cfg.base_contrast + (glareIntensity * cfg.max_contrast_offset);
                dynamicFilter = ` brightness(${autoBrightness.toFixed(2)}) contrast(${autoContrast.toFixed(2)}) saturate(${cfg.saturate})`;
            }
        
            let activeColor = appMemory.blueprint.camera_features.color_filters[appMemory.activeColorMode] || "saturate(1.0) contrast(1.0)";
            video.style.filter = `${activeColor}${dynamicFilter}`.trim();
        }

        // LOGIKA ORIENTASI GERAKAN LAYAR
        function handleOrientationChange() {
            const isLandscape = window.innerWidth > window.innerHeight;
            const tombolStatis = [
                document.getElementById('shutter_btn'),
                document.getElementById('gallery_preview'),
                document.getElementById('switch_camera'),
                document.getElementById('switch_mode'),
                document.getElementById('triple_dot_btn')
            ];

            tombolStatis.forEach(btn => {
                if (btn) {
                    if (isLandscape) { btn.classList.add('rotated'); } 
                    else { btn.classList.remove('rotated'); }
                }
            });
        }

        window.addEventListener('resize', handleOrientationChange);
        window.addEventListener('orientationchange', handleOrientationChange);
        handleOrientationChange();

        // 15. REGISTRASI SERVICE WORKER PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js'); });
        }
    </script>
