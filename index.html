<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ai Picture</title>
    <link rel="manifest" href="manifest.json">
    <style>
        /* CSS Dasar tetap di sini, tapi pengaturan posisi tombol pindahkan ke brain.js */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        #camera-view { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        .ui-element { position: absolute; z-index: 10; touch-action: none; display: flex; align-items: center; justify-content: center; border: none; outline: none; -webkit-tap-highlight-color: transparent; }
        #processing-canvas { display: none; }
    </style>
</head>
<body>
    <video id="camera-view" autoplay playsinline></video>
    <button id="gallery_preview" class="ui-element"></button>
    <button id="shutter_btn" class="ui-element"></button>
    <div id="right_actions_container" class="ui-element"></div>
    <button id="timer_btn" class="ui-element"></button>
    <input type="range" id="expSlider" class="ui-element">
    <button id="triple_dot_btn" class="ui-element"></button>
    <div id="dropdownMenu"></div>
    <canvas id="processing-canvas"></canvas>

    <!-- Urutan loading database dulu, baru brain -->
    <script src="database.js"></script>
    <script src="brain.js"></script>
</body>
</html>
