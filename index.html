<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kamera Web</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <style>
        /* CSS Reset & Pengunci Stabilitas Layar */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background: #000000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* Viewfinder Utama */
        #camera-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            object-fit: cover;
            background: #111;
        }

        /* Mengamankan elemen teks & tombol agar mutlak diam di memori & tidak goyang saat disentuh */
        .stable-text, .btn-ui { 
            touch-action: manipulation; 
            user-select: none;
            -webkit-user-select: none;
        }

        /* Komponen Tombol UI Berdasarkan Koordinat Blueprint */
        .btn-ui {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-weight: bold;
        }
        .btn-ui:active { background: rgba(255, 255, 255, 0.5); }

        #shutter_btn {
            background: #ffffff;
            border: 4px solid rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 0 4px #ffffff;
        }
        #shutter_btn:active { background: #cccccc; }

        #gallery_preview {
            background: #333;
            border: 2px solid #ffffff;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }

        /* Dropdown Menu Titik Tiga */
        #dropdownMenu {
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
            padding: 8px;
            width: 250px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            display: none; /* Tersembunyi default */
        }

        .menu-parent-label {
            padding: 8px;
            font-weight: bold;
            color: #2196F3;
            border-bottom: 1px solid #222;
            margin-top: 6px;
        }

        .menu-item-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background: none;
            border: none;
            color: #fff;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
        }
        .menu-item-btn:hover, .menu-item-btn:active {
            background: #2196F3;
        }

        /* Slider Exposure Vertikal */
        #expSlider {
            accent-color: #2196F3;
        }
    </style>
</head>
<body>

    <video id="camera-view" autoplay playsinline class="stable-text"></video>

    <button id="gallery_preview" class="btn-ui"></button>
    <button id="shutter_btn" class="btn-ui"></button>

    <div id="right_actions_container">
        <button id="switch_camera" class="btn-ui"></button>
        <button id="switch_mode" class="btn-ui"></button>
    </div>

    <button id="timer_btn" class="btn-ui"></button>
    <input type="range" id="expSlider">

    <button id="triple_dot_btn" class="stable-text" style="background:none; border:none; color:white; cursor:pointer;"></button>
    
    <div id="dropdownMenu"></div>

    <canvas id="capture-canvas" style="display:none;"></canvas>

    <script>
        // MEMORI UTAMA (State system agar RAM 2GB tidak bocor/leak)
        const appMemory = {
            blueprint: null,
            stream: null,
            currentFacingMode: "environment",
            cameraHistoryThumbs: [],
            currentZoom: 1,
            panX: 0,
            panY: 0
        };

        // AMBIL BLUEPRINT JSON (Anti-Cache Otomatis untuk Sinkronisasi PWA GitHub)
        fetch('kamus.json?v=' + Date.now())
            .then(res => {
                if(!res.ok) throw new Error();
                return res.json();
            })
            .then(data => {
                appMemory.blueprint = data;
                applyBlueprintUI();
                startCamera();
            })
            .catch(() => {
                // Fallback offline jika jaringan internet GitHub lambat
                fetch('kamus.json')
                    .then(res => res.json())
                    .then(data => {
                        appMemory.blueprint = data;
                        applyBlueprintUI();
                        startCamera();
                    });
            });

        // TERAPKAN UI BERDASARKAN BLUEPRINT JSON SECARA PRESISI
        function applyBlueprintUI() {
            const bp = appMemory.blueprint.navigation_buttons;
            
            // PWA Metadata
            document.title = appMemory.blueprint.app_metadata.application_name;

            // 1. Gallery Preview (Kiri Bawah)
            const gal = document.getElementById('gallery_preview');
            Object.assign(gal.style, bp.left_bottom.ui_coordinate);
            gal.style.width = bp.left_bottom.ui_coordinate.width_px + 'px';
            gal.style.height = bp.left_bottom.ui_coordinate.height_px + 'px';
            gal.onclick = () => alert('Buka Galeri Pratinjau (Maks 5 Slot Memori)');

            // 2. Shutter Button (Tengah Bawah)
            const shut = document.getElementById('shutter_btn');
            Object.assign(shut.style, bp.center_bottom.ui_coordinate);
            shut.style.width = bp.center_bottom.ui_coordinate.width_px + 'px';
            shut.style.height = bp.center_bottom.ui_coordinate.height_px + 'px';
            shut.onclick = () => executeCapture();

            // 3. Right Bottom Group (Container)
            const rContainer = document.getElementById('right_actions_container');
            Object.assign(rContainer.style, bp.right_bottom_group.ui_coordinate);
            rContainer.style.gap = bp.right_bottom_group.ui_coordinate.gap_px + 'px';

            // Button Switch Cam & Mode
            const btnCam = document.getElementById('switch_camera');
            btnCam.innerText = bp.right_bottom_group.buttons[0].label;
            btnCam.style.width = bp.right_bottom_group.buttons[0].width_px + 'px';
            btnCam.style.height = bp.right_bottom_group.buttons[0].height_px + 'px';
            btnCam.onclick = () => toggleCameraFacing();

            const btnMode = document.getElementById('switch_mode');
            btnMode.innerText = bp.right_bottom_group.buttons[1].label;
            btnMode.style.width = bp.right_bottom_group.buttons[1].width_px + 'px';
            btnMode.style.height = bp.right_bottom_group.buttons[1].height_px + 'px';

            // 4. Left Mid Controls (Timer & Exposure)
            const tBtn = document.getElementById('timer_btn');
            tBtn.innerText = bp.left_mid_controls.timer_button.label;
            Object.assign(tBtn.style, bp.left_mid_controls.timer_button.ui_coordinate);
            tBtn.style.width = bp.left_mid_controls.timer_button.ui_coordinate.width_px + 'px';
            tBtn.style.height = bp.left_mid_controls.timer_button.ui_coordinate.height_px + 'px';

            const slider = document.getElementById('expSlider');
            slider.min = bp.left_mid_controls.brightness_slider.min;
            slider.max = bp.left_mid_controls.brightness_slider.max;
            slider.step = bp.left_mid_controls.brightness_slider.step;
            Object.assign(slider.style, bp.left_mid_controls.brightness_slider.ui_coordinate);
            slider.style.width = bp.left_mid_controls.brightness_slider.ui_coordinate.width_px + 'px';
            slider.oninput = (e) => applyExposure(e.target.value);

            // 5. Top Bar Controls (Menu Titik Tiga)
            const dotBtn = document.getElementById('triple_dot_btn');
            dotBtn.innerText = bp.top_bar_controls.menu_button.label;
            Object.assign(dotBtn.style, bp.top_bar_controls.menu_button.ui_coordinate);
            dotBtn.style.fontSize = bp.top_bar_controls.menu_button.ui_coordinate.font_size_px + 'px';
            dotBtn.onclick = () => toggleMenu();

            const menuBox = document.getElementById('dropdownMenu');
            Object.assign(menuBox.style, bp.top_bar_controls.dropdown_box.ui_coordinate);
            
            // Build Elemen Menu dari Data JSON
            buildDropdownMenu();

            // 6. Viewfinder Interaksi
            const vView = document.getElementById('camera-view');
            vView.onclick = () => { menuBox.style.display = 'none'; };
        }

        // MEMBUAT ISI DROP-DOWN MENU SECARA DINAMIS
        function buildDropdownMenu() {
            const menuBox = document.getElementById('dropdownMenu');
            menuBox.innerHTML = '';
            
            appMemory.blueprint.menu_titik_tiga.forEach(group => {
                const label = document.createElement('div');
                label.className = 'menu-parent-label stable-text';
                label.innerText = group.label;
                menuBox.appendChild(label);

                const items = group.sub_menu || group.items || [];
                items.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'menu-item-btn stable-text';
                    btn.innerText = item.label;
                    btn.onclick = () => {
                        alert(`Aksi dijalankan: ${item.action} (${item.value})`);
                        if(item.action === "setSharpness") applySharpnessFilter(item.value);
                        menuBox.style.display = 'none';
                    };
                    menuBox.appendChild(btn);
                });
            });
        }

        function toggleMenu() {
            const menu = document.getElementById('dropdownMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        // AKSI HARDWARE: MENJALANKAN ALIRAN KAMERA ASLI HP
        function startCamera() {
            if (appMemory.stream) {
                appMemory.stream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: appMemory.currentFacingMode,
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(stream => {
                    appMemory.stream = stream;
                    document.getElementById('camera-view').srcObject = stream;
                })
                .catch(err => alert("Gagal mengakses kamera hardware: " + err));
        }

        function toggleCameraFacing() {
            appMemory.currentFacingMode = appMemory.currentFacingMode === "user" ? "environment" : "user";
            startCamera();
        }

        // LOGIK BLUEPRINT: ANTI CRASH RAM 2GB (Menggunakan jeda eksekusi aman)
        function executeCapture() {
            const shutterBtn = document.getElementById('shutter_btn');
            
            // Aturan blueprint: anti_crash_loading
            shutterBtn.disabled = true;
            shutterBtn.innerText = '⏳...';

            setTimeout(() => {
                const video = document.getElementById('camera-view');
                const canvas = document.getElementById('capture-canvas');
                const ctx = canvas.getContext('2d');

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                
                // Terapkan filter ketajaman sebelum menggambar frame ke canvas
                ctx.filter = video.style.filter;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Konversi aman format gambar
                const base64Data = canvas.toDataURL('image/webp', 0.9);

                // Aturan blueprint: multi_frame_buffer (Maksimal 5 riwayat di memori)
                appMemory.cameraHistoryThumbs.unshift(base64Data);
                if(appMemory.cameraHistoryThumbs.length > 5) {
                    appMemory.cameraHistoryThumbs.pop();
                }

                // Update UI Gallery Preview Kiri bawah dengan foto terakhir
                document.getElementById('gallery_preview').style.backgroundImage = `url(${base64Data})`;

                // Kembalikan tombol shutter
                shutterBtn.disabled = false;
                shutterBtn.innerText = '';
            }, 50); // Jeda 50ms asistensi hardware
        }

        // ATUR KETAJAMAN & FILTER CSS KONTRAST (Sesuai objek sharpness_modes)
        function applySharpnessFilter(mode) {
            const video = document.getElementById('camera-view');
            const modes = appMemory.blueprint.sharpness_modes[mode];
            if(modes && modes.sharpness_filter !== "none") {
                video.style.filter = modes.sharpness_filter;
            } else {
                video.style.filter = "none";
            }
        }

        function applyExposure(val) {
            // Mengatur filter brightness simulasi exposure manual
            const video = document.getElementById('camera-view');
            const calculatedBrightness = 1 + (val * 0.1);
            video.style.filter = `brightness(${calculatedBrightness})`;
        }

        // REGISTRASI SINKRONISASI PWA LOKAL HP (sw.js)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('PWA Kamera Web Terhubung Otomatis.'))
                    .catch(err => console.log('SW Error:', err));
            });
        }
    </script>
</body>
</html>
